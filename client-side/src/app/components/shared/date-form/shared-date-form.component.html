@if (range) {
  <div [formGroup]="form">
    <mat-form-field appearance="fill" class="example-full-width">
      <mat-label>{{ dateFields.label }}</mat-label>
      <mat-date-range-input [rangePicker]="picker">
        <input
          matStartDate
          [placeholder]="dateFields.inputs?.[0]?.placeholder ?? ''"
          [formControlName]="dateFields.inputs?.[0]?.name ?? ''"
        />
        <input
          matEndDate
          [placeholder]="dateFields.inputs?.[1]?.placeholder ?? ''"
          [formControlName]="dateFields.inputs?.[1]?.name ?? ''"
        />
      </mat-date-range-input>
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-date-range-picker #picker></mat-date-range-picker>
    </mat-form-field>
  </div>
} @else {
  <div [formGroup]="form">
    <mat-form-field appearance="fill" class="example-full-width">
      <mat-label>{{ dateFields.label }}</mat-label>
      <input matInput [matDatepicker]="picker" [formControlName]="dateFields.name" />
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>
  </div>
}
