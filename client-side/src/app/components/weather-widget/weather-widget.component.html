<article class="widget">
  <div class="weatherIcon"><i class="wi wi-{{weatherDetails?.icon}}"></i></div>
  <div class="weatherInfo">
    <span class="temperature">{{weatherDetails?.temperature}}&deg;</span>
    <div class="description">    
      <h3 class="weatherCondition">{{weatherDetails?.description}}</h3>    
      <p class="place">{{weatherDetails?.location}}</p>
    </div>
  </div>
  <span class="date">{{weatherDetails?.date}}</span>
</article>
