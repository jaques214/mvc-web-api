<h1 mat-dialog-title>Session</h1>
<form [formGroup]="sessionForm" (ngSubmit)="onConfirm()">
<div mat-dialog-content>
  @for (field of formField.inputs; track field.name) {
    <div>
      <app-shared-field-form [input]="field" [form]="sessionForm"></app-shared-field-form>
    </div>
  }
</div>
<div mat-dialog-actions>
  <button mat-raised-button color="primary" type="submit">
    Add
  </button>
  <button mat-button mat-dialog-close (click)="onCancel()">Cancel</button>
</div>
</form>
