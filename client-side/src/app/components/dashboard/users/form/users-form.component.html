<mat-card class="card">
  <mat-card-header>
    <mat-card-title>Users</mat-card-title>
    <mat-card-subtitle>{{ title }}</mat-card-subtitle>
  </mat-card-header>
  <form (ngSubmit)="onSubmit()">
    <mat-card-content>
      @for (field of formFields.inputs; track field) {
        <div>
          @if (field.type != "complex") {
            <app-shared-field-form [input]="field"></app-shared-field-form>
          } @else {
            @for (input of field.inputs; track input) {
              <app-shared-field-form [input]="input"></app-shared-field-form>
            }
          }
        </div>
      }
    </mat-card-content>
    <mat-card-actions class="card-actions">
      <div class="container">
        <button mat-button [routerLink]="['/dashboard/users']">
          <mat-icon aria-hidden="false" aria-label="arrow back ios icon"
            >arrow_back_ios</mat-icon
          >
        </button>
      </div>
      @if (user) {
        <button
          mat-raised-button
          color="secundary"
          type="button"
          (click)="onDelete()"
        >
          Delete
        </button>
      }
      <button mat-raised-button color="primary" type="submit">Submit</button>
    </mat-card-actions>
  </form>
</mat-card>
